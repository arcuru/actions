# Sets up a deps/ branch for dependency update workflows.
# Each run gets its own dated branch so a new update opens a new PR rather than
# rewriting an existing one — rewriting reset the hold period on every run, which
# kept long-lived deps PRs permanently held.
#
name: Setup Deps Branch
description: Create a dated dependency update branch

inputs:
  prefix:
    description: "Branch prefix (e.g. deps/cargo-update); the run date is appended"
    required: true

outputs:
  branch:
    description: "Full branch name, <prefix>-YYYY-MM-DD"
    value: ${{ steps.setup.outputs.branch }}

runs:
  using: composite
  steps:
    - name: Setup branch
      id: setup
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # -B rather than -b so a same-day re-run reuses the branch instead of failing.
        BRANCH="$PREFIX-$(date -u +%Y-%m-%d)"
        git checkout -B "$BRANCH"

        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
