# Self-dogfood: audit this repo's own pinned actions and workflows daily.
name: "Self: actions-audit"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # The called workflow's token is the intersection with these, and the zizmor
  # SARIF upload needs security-events: write.
  security-events: write

jobs:
  call:
    uses: ./.github/workflows/actions-audit.yml
    secrets: inherit
