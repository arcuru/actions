# Monthly cargo dependency update. Runs `cargo update` to bump Cargo.lock,
# then creates a PR on the deps/cargo-update branch with a configurable hold
# period before merge. CI handles verification via normal PR checks.
#
name: "Deps: Cargo Update"

on:
  workflow_call:
    inputs:
      hold-days:
        description: "Days to hold before allowing merge."
        required: false
        default: "7"
        type: string
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job (e.g. 'automation' to attach approval rules). Empty string runs without an environment."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache. Set to 'false' if relying solely on a custom cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs (custom caches)."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys for the substituters above."
        required: false
        default: ""
        type: string
    secrets:
      PAT_TOKEN:
        description: "Fine-grained PAT with contents:write + pull-requests:write on the calling repo. Required so the resulting PR can trigger downstream workflows."
        required: true

concurrency:
  group: deps-cargo-update
  cancel-in-progress: true

jobs:
  cargo-update:
    name: Cargo Update
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Nix
        uses: arcuru/actions/.github/actions/setup-nix@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      - name: Setup deps branch
        uses: arcuru/actions/.github/actions/setup-deps-branch@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          branch: deps/cargo-update

      - name: Run cargo update
        id: update
        run: |
          # Capture the exit code explicitly instead of letting `set -e` abort
          # mid-assignment: the command substitution swallows stderr, so an
          # aborted step would fail with no diagnostic output at all.
          set +e
          OUTPUT=$(nix develop --command cargo update 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          DELIM="UPDATE_EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "output<<${DELIM}"
            echo "$OUTPUT"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Capture diff stats
        id: diff
        run: |
          if ! git diff --quiet Cargo.lock; then
            DIFF=$(git diff --stat Cargo.lock)
            {
              echo "stat<<DIFF_EOF"
              echo "$DIFF"
              echo "DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and create PR
        uses: arcuru/actions/.github/actions/commit-and-pr@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          branch: deps/cargo-update
          files: Cargo.lock
          commit-message: "chore(deps): update cargo dependencies"
          pr-title: "chore(deps): update cargo dependencies"
          pr-body: |
            ## Cargo Dependency Update

            Monthly `cargo update` of `Cargo.lock` dependencies.

            <details>
            <summary>cargo update output</summary>

            ```
            ${{ steps.update.outputs.output }}
            ```

            </details>

            <details>
            <summary>Diff stats</summary>

            ```
            ${{ steps.diff.outputs.stat }}
            ```

            </details>
          hold-days: ${{ inputs.hold-days }}
          update-comment: "Updated with latest `cargo update` results."
          github-token: ${{ secrets.PAT_TOKEN }}
