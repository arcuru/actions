# Monthly cargo dependency update. Runs `cargo update` to bump Cargo.lock,
# then creates a PR on the deps/cargo-update branch with a configurable hold
# period before merge. CI handles verification via normal PR checks.
#
name: "Deps: Cargo Update"

on:
  workflow_call:
    inputs:
      hold-days:
        description: "Days to hold before allowing merge."
        required: false
        default: "7"
        type: string
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job (e.g. 'automation' to attach approval rules). Empty string runs without an environment."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache. Set to 'false' if relying solely on a custom cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs (custom caches)."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys for the substituters above."
        required: false
        default: ""
        type: string
    secrets:
      PAT_TOKEN:
        description: "Fine-grained PAT with contents:write + pull-requests:write on the calling repo. Required so the resulting PR can trigger downstream workflows."
        required: true

concurrency:
  group: deps-cargo-update
  cancel-in-progress: true

jobs:
  cargo-update:
    name: Cargo Update
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      - name: Setup deps branch
        id: branch
        uses: $/.github/actions/setup-deps-branch
        with:
          prefix: deps/cargo-update

      # Keep cold-cache Nix build diagnostics out of the cargo report.
      - name: Warm the dev shell
        run: nix develop --command true

      - name: Run cargo update
        id: update
        run: |
          set +e
          nix develop --command cargo update 2>&1 | tee "$REPORT"
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          if (( PIPE_STATUSES[1] != 0 )); then
            exit "${PIPE_STATUSES[1]}"
          fi
          exit "${PIPE_STATUSES[0]}"
        env:
          REPORT: ${{ runner.temp }}/cargo-update.txt

      - name: Capture diff stats
        id: diff
        run: |
          git diff --stat Cargo.lock > "$DIFF_FILE"
        env:
          DIFF_FILE: ${{ runner.temp }}/cargo-update-diff.txt

      - name: Generate PR body
        run: |
          # A PR body is capped at 65536 characters. Keep the report on disk
          # and truncate only the display copy, leaving room for the hold text.
          MAX_REPORT_BYTES=50000
          DISPLAY_FILE="$REPORT"
          if [ "$(wc -c < "$REPORT")" -gt "$MAX_REPORT_BYTES" ]; then
            DISPLAY_FILE="${REPORT}.tail"
            # Drop the partial first line to avoid splitting UTF-8 sequences.
            tail -c "$MAX_REPORT_BYTES" "$REPORT" | tail -n +2 > "$DISPLAY_FILE"
          fi

          {
            echo '## Cargo Dependency Update'
            echo
            echo "Monthly \`cargo update\` of \`Cargo.lock\` dependencies."
            echo
            if [ "$DISPLAY_FILE" != "$REPORT" ]; then
              echo "> Output truncated to the last ${MAX_REPORT_BYTES} bytes. The full report is in the [workflow run log](${RUN_URL})."
              echo
            fi
            echo '<details>'
            echo '<summary>cargo update output</summary>'
            echo
            echo '```'
            cat "$DISPLAY_FILE"
            echo
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details>'
            echo '<summary>Diff stats</summary>'
            echo
            echo '```'
            cat "$DIFF_FILE"
            echo
            echo '```'
            echo
            echo '</details>'
          } > "$BODY_FILE"
        env:
          REPORT: ${{ runner.temp }}/cargo-update.txt
          DIFF_FILE: ${{ runner.temp }}/cargo-update-diff.txt
          BODY_FILE: ${{ runner.temp }}/cargo-update-pr.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit and create PR
        uses: $/.github/actions/commit-and-pr
        with:
          branch: ${{ steps.branch.outputs.branch }}
          files: Cargo.lock
          commit-message: "chore(deps): update cargo dependencies"
          pr-title: "chore(deps): update cargo dependencies"
          pr-body-file: ${{ runner.temp }}/cargo-update-pr.md
          hold-days: ${{ inputs.hold-days }}
          update-comment: "Updated with latest `cargo update` results."
          github-token: ${{ secrets.PAT_TOKEN }}
