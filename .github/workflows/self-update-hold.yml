# Self-dogfood: remove the on-hold label from this repo's own deps/*
# PRs once their hold-until date is reached.
#
# Runs in the automation environment: this repo's PAT_TOKEN is an environment
# secret, and `secrets: inherit` can only resolve it inside a job that declares
# that environment. Without it the called workflow fails before any step runs,
# with "Secret PAT_TOKEN is required, but not provided while calling".
name: "Self: update-hold"

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  call:
    uses: ./.github/workflows/update-hold.yml
    with:
      environment: automation
    secrets: inherit
