# Validate this repo's own workflow YAML on every PR and on push to main.
# actionlint is installed via Nix (reusing our own setup-nix composite action),
# so this also exercises the setup-nix action end-to-end on every PR.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job: never leave the token in the checkout's git config.
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run actionlint
        run: |
          set -uo pipefail

          # actionlint (1.7.12, current) rejects the self-repository syntax
          # `$/<path>` as a malformed `uses:` value: it accepts only
          # `{owner}/{repo}@{ref}` and `./path`. GitHub shipped `$/` on
          # 2026-07-30; actionlint's last release predates it by four months.
          #
          # The scoped `-ignore` below suppresses exactly that parse-time
          # rejection and nothing else: in actionlint's regex dialect `\$`
          # matches a literal `$`, and the leading `"` anchors the pattern to
          # the quoted action name, so a `$/` self-reference is ignored while a
          # genuinely malformed ref (e.g. `uses: actions/checkout` with no
          # `@ref`) is still reported. Delete the flag once actionlint
          # understands `$/` (upstream issue #711).
          nix run nixpkgs#actionlint -- \
            -color \
            -ignore 'specifying action "\$/' \
            .github/workflows/*.yml
