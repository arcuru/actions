# Validate this repo's own workflow YAML on every PR and on push to main.
# actionlint is installed via Nix (reusing our own setup-nix composite action),
# so this also exercises the setup-nix action end-to-end on every PR.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job: never leave the token in the checkout's git config.
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run actionlint
        run: |
          set -uo pipefail

          # actionlint 1.7.12 lacks `$/` support. Suppress only its missing-ref
          # diagnostic for self-repository action paths and its unsupported
          # reusable-workflow format diagnostic, not other lint.
          # Remove this workaround when support ships:
          # https://github.com/rhysd/actionlint/issues/711
          nix run nixpkgs#actionlint -- \
            -color \
            -ignore '^specifying action "\$/[^"@]+" in invalid format because ref is missing\.' \
            -ignore '^reusable workflow call "\$/\.github/workflows/[^"/@]+\.ya?ml" at "uses" is not following the format ' \
            .github/workflows/*.yml

      - name: Run self-reference regressions
        run: |
          nix shell nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#jq nixpkgs#uv \
            --command uv run .github/tests/test_self_references.py
