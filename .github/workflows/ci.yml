# Validate this repo's own workflow YAML on every PR and on push to main.
# actionlint is installed via Nix (reusing our own setup-nix composite action),
# so this also exercises the setup-nix action end-to-end on every PR.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: never leave the token in the checkout's git config.
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run actionlint
        run: nix run nixpkgs#actionlint -- -color .github/workflows/*.yml
