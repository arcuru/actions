# Monthly GitHub Actions version update. Parses SHA-pinned `uses:` lines
# across all workflow files, queries the GitHub API for latest releases,
# and updates the SHA and version comment in-place. Handles two ref
# shapes (OWNER/REPO@SHA and OWNER/REPO/PATH@SHA) and the
# dtolnay/rust-toolchain master-tracking quirk. Creates a PR on the
# deps/actions-update branch with a configurable hold period before
# merge. CI handles verification via normal PR checks.
#
name: "Deps: Actions Update"

on:
  workflow_call:
    inputs:
      hold-days:
        description: "Days to hold before allowing merge."
        required: false
        default: "7"
        type: string
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys."
        required: false
        default: ""
        type: string
    secrets:
      PAT_TOKEN:
        description: "Fine-grained PAT with contents:write + pull-requests:write on the calling repo."
        required: true

concurrency:
  group: deps-actions-update
  cancel-in-progress: true

jobs:
  actions-update:
    name: Actions Update
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Nix
        uses: arcuru/actions/.github/actions/setup-nix@96f1d10b48db5907d8aa1fb517787b1d6e8ca4dd # v0.1.0
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      - name: Setup deps branch
        uses: arcuru/actions/.github/actions/setup-deps-branch@96f1d10b48db5907d8aa1fb517787b1d6e8ca4dd # v0.1.0
        with:
          branch: deps/actions-update

      - name: Update action versions
        id: update
        run: |
          CHANGES=""

          update_action() {
            local FILE="$1"
            local OWNER="$2"
            local REPO="$3"
            local SUBPATH="$4"        # empty or leading "/" then path-into-repo (e.g. /.github/actions/setup-nix)
            local CURRENT_SHA="$5"
            local CURRENT_TAG="$6"
            local DISPLAY="${OWNER}/${REPO}${SUBPATH}"

            # dtolnay/rust-toolchain uses branches, not releases; track master branch directly
            if [ "$OWNER/$REPO" = "dtolnay/rust-toolchain" ]; then
              NEW_SHA=$(gh api "repos/$OWNER/$REPO/branches/master" --jq '.commit.sha' 2>/dev/null || true)
              if [ -z "$NEW_SHA" ] || [ "$NEW_SHA" = "$CURRENT_SHA" ]; then
                return
              fi
              sed -i "s|${OWNER}/${REPO}${SUBPATH}@${CURRENT_SHA} # ${CURRENT_TAG}|${OWNER}/${REPO}${SUBPATH}@${NEW_SHA} # ${CURRENT_TAG}|g" "$FILE"
              if ! git diff --quiet "$FILE"; then
                CHANGES="${CHANGES}- \`${DISPLAY}\`: updated master SHA (in \`$(basename "$FILE")\`)\n"
              fi
              return
            fi

            # Tag/release lookup is keyed on OWNER/REPO, never on the subpath — a composite action
            # inside arcuru/actions/.github/actions/setup-nix shares its tags with the host repo.

            # Get latest release
            LATEST=$(gh api "repos/$OWNER/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ -z "$LATEST" ]; then
              LATEST=$(gh api "repos/$OWNER/$REPO/tags" --jq '.[0].name' 2>/dev/null || true)
            fi
            if [ -z "$LATEST" ]; then
              return
            fi

            if [ "$LATEST" = "$CURRENT_TAG" ]; then
              return
            fi

            # Get the SHA and type for the latest tag ref
            REF_INFO=$(gh api "repos/$OWNER/$REPO/git/ref/tags/$LATEST" --jq '.object | "\(.sha) \(.type)"' 2>/dev/null || true)
            if [ -z "$REF_INFO" ]; then
              return
            fi
            NEW_SHA=$(echo "$REF_INFO" | cut -d' ' -f1)
            REF_TYPE=$(echo "$REF_INFO" | cut -d' ' -f2)

            # For annotated tags, resolve to the underlying commit
            if [ "$REF_TYPE" = "tag" ]; then
              NEW_SHA=$(gh api "repos/$OWNER/$REPO/git/tags/$NEW_SHA" --jq '.object.sha' 2>/dev/null || true)
              if [ -z "$NEW_SHA" ]; then
                return
              fi
            fi

            if [ "$NEW_SHA" = "$CURRENT_SHA" ]; then
              return
            fi

            sed -i "s|${OWNER}/${REPO}${SUBPATH}@${CURRENT_SHA} # ${CURRENT_TAG}|${OWNER}/${REPO}${SUBPATH}@${NEW_SHA} # ${LATEST}|g" "$FILE"

            if ! git diff --quiet "$FILE"; then
              CHANGES="${CHANGES}- \`${DISPLAY}\`: ${CURRENT_TAG} → ${LATEST} (in \`$(basename "$FILE")\`)\n"
            fi
          }

          for FILE in .github/workflows/*.yml; do
            [ -f "$FILE" ] || continue

            FILE_CONTENT=$(cat "$FILE")

            # Two shapes:
            #   OWNER/REPO@SHA # vX.Y.Z                       (most third-party actions)
            #   OWNER/REPO/PATH/INTO/REPO@SHA # vX.Y.Z         (composite actions or reusable
            #                                                  workflows inside a shared repo)
            # The second-segment match excludes / and @ to keep the repo name exactly one path
            # segment; SUBPATH then greedily captures the rest up to the @.
            while IFS= read -r LINE; do
              if [[ "$LINE" =~ uses:[[:space:]]+([^/]+)/([^/@]+)(/[^@]*)?@([a-f0-9]+)[[:space:]]+#[[:space:]]*(.*) ]]; then
                OWNER="${BASH_REMATCH[1]}"
                REPO="${BASH_REMATCH[2]}"
                SUBPATH="${BASH_REMATCH[3]}"
                CURRENT_SHA="${BASH_REMATCH[4]}"
                CURRENT_TAG=$(echo "${BASH_REMATCH[5]}" | xargs)

                update_action "$FILE" "$OWNER" "$REPO" "$SUBPATH" "$CURRENT_SHA" "$CURRENT_TAG"
              fi
            done <<< "$FILE_CONTENT"
          done

          if [ -z "$CHANGES" ]; then
            CHANGES="No action updates available."
          fi

          {
            echo "changes<<CHANGES_EOF"
            echo -e "$CHANGES"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and create PR
        uses: arcuru/actions/.github/actions/commit-and-pr@96f1d10b48db5907d8aa1fb517787b1d6e8ca4dd # v0.1.0
        with:
          branch: deps/actions-update
          files: ".github/workflows/"
          commit-message: "chore(deps): update GitHub Actions versions"
          pr-title: "chore(deps): update GitHub Actions versions"
          pr-body: |
            ## GitHub Actions Update

            Monthly update of GitHub Actions to latest versions.

            ### Updated Actions

            ${{ steps.update.outputs.changes }}
          hold-days: ${{ inputs.hold-days }}
          update-comment: "Updated with latest action versions."
          github-token: ${{ secrets.PAT_TOKEN }}
