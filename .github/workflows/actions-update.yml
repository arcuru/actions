# Monthly GitHub Actions version update. Parses SHA-pinned `uses:` lines
# across all workflow files and composite action manifests, queries the
# GitHub API for latest releases,
# and updates the SHA and version comment in-place. Handles two ref
# shapes (OWNER/REPO@SHA and OWNER/REPO/PATH@SHA) and the
# branch-tracking pins (a branch name in place of a version). References into
# the repository being updated are left alone and logged; the Actions audit
# reports those on content drift instead. Creates a PR on the
# deps/actions-update branch with a configurable hold period before
# merge. CI handles verification via normal PR checks.
#
name: "Deps: Actions Update"

on:
  workflow_call:
    inputs:
      hold-days:
        description: "Days to hold before allowing merge."
        required: false
        default: "7"
        type: string
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys."
        required: false
        default: ""
        type: string
    secrets:
      PAT_TOKEN:
        description: "Fine-grained PAT with contents:write + pull-requests:write on the calling repo."
        required: true

concurrency:
  group: deps-actions-update
  cancel-in-progress: true

jobs:
  actions-update:
    name: Actions Update
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Nix
        uses: arcuru/actions/.github/actions/setup-nix@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      - name: Setup deps branch
        id: branch
        uses: arcuru/actions/.github/actions/setup-deps-branch@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          prefix: deps/actions-update

      # Discovery and parsing come from the shared scan-pins action, so the
      # updater and the pin verifier work from one definition of what a pin is
      # and where pins live. Verification cannot fall behind the files this job
      # rewrites.
      - name: Scan pins
        id: scan
        uses: arcuru/actions/.github/actions/scan-pins@6568fce9d9e09782fcec9d9653411b35075c7902 # main

      - name: Update action versions
        id: update
        run: |
          CHANGES=""
          TOUCHED=()

          # A literal control character as the s/// delimiter, so a version
          # comment containing the delimiter cannot terminate the expression.
          SED_D=$(printf '\001')

          # Escape BRE metacharacters so a version comment is matched literally
          # rather than as a pattern ('.' in v1.2.3 would otherwise match any
          # character).
          bre_quote() {
            printf '%s' "$1" | sed 's/[].[*^$\\]/\\&/g'
          }

          # Escape the replacement side, where \ and & carry meaning.
          repl_quote() {
            printf '%s' "$1" | sed 's/[\\&]/\\&/g'
          }

          # A lookup that fails must not read as "nothing to update".
          LOOKUPS_OK=0
          LOOKUPS_FAILED=0

          update_action() {
            local FILE="$1"
            local OWNER="$2"
            local REPO="$3"
            local SUBPATH="$4"        # empty or leading "/" then path-into-repo (e.g. /.github/actions/setup-nix)
            local CURRENT_SHA="$5"
            local CURRENT_TAG="$6"
            local CLASS="$7"          # immutable | mutable | branch, from the shared classifier
            local DISPLAY="${OWNER}/${REPO}${SUBPATH}"
            # Compare this file before and after, so the change list records what
            # was actually rewritten rather than "this file is dirty".
            local BEFORE
            BEFORE=$(cat "$FILE")

            # Branch-tracking pins carry a branch name where a version would go
            # (dtolnay/rust-toolchain publishes no releases; this repo's own
            # references track main). Follow that branch instead of a release.
            if [ "$CLASS" = "branch" ]; then
              if ! NEW_SHA=$(gh api "repos/$OWNER/$REPO/branches/$CURRENT_TAG" --jq '.commit.sha' 2>/dev/null); then
                LOOKUPS_FAILED=$((LOOKUPS_FAILED + 1))
                echo "::warning::could not resolve branch ${CURRENT_TAG} of ${OWNER}/${REPO}"
                return
              fi
              LOOKUPS_OK=$((LOOKUPS_OK + 1))
              if [ -z "$NEW_SHA" ] || [ "$NEW_SHA" = "$CURRENT_SHA" ]; then
                return
              fi
              sed -i "s${SED_D}\([\"']\{0,1\}\)${OWNER}/${REPO}${SUBPATH}@${CURRENT_SHA}\([\"']\{0,1\}\)[[:space:]]*#[[:space:]]*$(bre_quote "$CURRENT_TAG")[[:space:]]*\$${SED_D}\1${OWNER}/${REPO}${SUBPATH}@${NEW_SHA}\2 # $(repl_quote "$CURRENT_TAG")${SED_D}g" "$FILE"
              if [ "$(cat "$FILE")" != "$BEFORE" ]; then
                CHANGES="${CHANGES}- \`${DISPLAY}\`: updated ${CURRENT_TAG} SHA (in \`$(basename "$FILE")\`)\n"
                TOUCHED+=("$FILE")
              fi
              return
            fi

            # Tag/release lookup is keyed on OWNER/REPO, never on the subpath — a composite action
            # inside arcuru/actions/.github/actions/setup-nix shares its tags with the host repo.

            # Get latest release
            LATEST=$(gh api "repos/$OWNER/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ -z "$LATEST" ]; then
              LATEST=$(gh api "repos/$OWNER/$REPO/tags" --jq '.[0].name' 2>/dev/null || true)
            fi
            if [ -z "$LATEST" ]; then
              return
            fi

            if [ "$LATEST" = "$CURRENT_TAG" ]; then
              return
            fi

            # Get the SHA and type for the latest tag ref
            REF_INFO=$(gh api "repos/$OWNER/$REPO/git/ref/tags/$LATEST" --jq '.object | "\(.sha) \(.type)"' 2>/dev/null || true)
            if [ -z "$REF_INFO" ]; then
              return
            fi
            NEW_SHA=$(echo "$REF_INFO" | cut -d' ' -f1)
            REF_TYPE=$(echo "$REF_INFO" | cut -d' ' -f2)

            # For annotated tags, resolve to the underlying commit
            if [ "$REF_TYPE" = "tag" ]; then
              NEW_SHA=$(gh api "repos/$OWNER/$REPO/git/tags/$NEW_SHA" --jq '.object.sha' 2>/dev/null || true)
              if [ -z "$NEW_SHA" ]; then
                return
              fi
            fi

            if [ "$NEW_SHA" = "$CURRENT_SHA" ]; then
              return
            fi

            sed -i "s${SED_D}\([\"']\{0,1\}\)${OWNER}/${REPO}${SUBPATH}@${CURRENT_SHA}\([\"']\{0,1\}\)[[:space:]]*#[[:space:]]*$(bre_quote "$CURRENT_TAG")[[:space:]]*\$${SED_D}\1${OWNER}/${REPO}${SUBPATH}@${NEW_SHA}\2 # $(repl_quote "$LATEST")${SED_D}g" "$FILE"

            if [ "$(cat "$FILE")" != "$BEFORE" ]; then
              CHANGES="${CHANGES}- \`${DISPLAY}\`: ${CURRENT_TAG} → ${LATEST} (in \`$(basename "$FILE")\`)\n"
              TOUCHED+=("$FILE")
            fi
          }

          # References naming the repository being updated are internal
          # coupling, not dependencies: a reusable workflow's relative `./`
          # paths resolve against the caller's workspace, so a repository that
          # ships actions must name its own by absolute reference. Their
          # comment tracks that same repository's branch, which merging this
          # job's PR advances — so bumping them manufactures exactly the drift
          # the next run would find. Whether they point at stale content is a
          # different question, answered by the Actions audit.
          SELF_SKIPPED=()

          while IFS=$'\x1f' read -r FILE OWNER REPO SUBPATH CURRENT_SHA CURRENT_TAG CLASS REF_KIND; do
            if [ "${OWNER,,}/${REPO,,}" = "${GITHUB_REPOSITORY,,}" ]; then
              SELF_SKIPPED+=("${OWNER}/${REPO}${SUBPATH}")
              continue
            fi
            # Pins with no version comment cannot be rewritten in place, since
            # the substitution keys on the trailing "# TAG". They are reported
            # by the pin audit instead.
            [ "$CLASS" = "none" ] && continue
            [ "$CLASS" = "unknown" ] && continue
            [ "$REF_KIND" != "sha" ] && continue
            update_action "$FILE" "$OWNER" "$REPO" "$SUBPATH" "$CURRENT_SHA" "$CURRENT_TAG" "$CLASS"
          done < <(
            printf '%s' "$SCANNED_PINS" | jq -r '
              .[] | [.file, .owner, .repo, .subpath, .ref, .tag, .class, .ref_kind] | join("\u001f")'
          )

          # Coverage this job declines to provide is stated, not dropped: a
          # reference silently missing from the update set is indistinguishable
          # from one that was already up to date.
          if [ "${#SELF_SKIPPED[@]}" -gt 0 ]; then
            SELF_LIST=$(printf '%s\n' "${SELF_SKIPPED[@]}" | sort -u)
            SELF_COUNT=$(printf '%s\n' "$SELF_LIST" | wc -l)
            echo "::notice::skipped ${SELF_COUNT} self-reference(s) into ${GITHUB_REPOSITORY}; these track this repository and are checked for content drift by the Actions audit instead."
            printf '%s\n' "$SELF_LIST" | sed 's/^/  skipped self-reference: /'
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="No action updates available."
          fi

          # Stage exactly the files we edited — keeps the commit step in sync
          # with discovery instead of mirroring the glob in a second place.
          FILES_CHANGED=$(printf '%s\n' "${TOUCHED[@]}" | sort -u | xargs)

          {
            echo "changes<<CHANGES_EOF"
            echo -e "$CHANGES"
            echo "CHANGES_EOF"
            echo "files=${FILES_CHANGED}"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCANNED_PINS: ${{ steps.scan.outputs.pins }}

      - name: Commit and create PR
        uses: arcuru/actions/.github/actions/commit-and-pr@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          branch: ${{ steps.branch.outputs.branch }}
          files: ${{ steps.update.outputs.files }}
          commit-message: "chore(deps): update GitHub Actions versions"
          pr-title: "chore(deps): update GitHub Actions versions"
          pr-body: |
            ## GitHub Actions Update

            Monthly update of GitHub Actions to latest versions.

            ### Updated Actions

            ${{ steps.update.outputs.changes }}
          hold-days: ${{ inputs.hold-days }}
          update-comment: "Updated with latest action versions."
          github-token: ${{ secrets.PAT_TOKEN }}
