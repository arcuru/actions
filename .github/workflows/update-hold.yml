# Daily check that releases expired dependency holds. Scans open PRs with
# the "on-hold" label, parses the <!-- hold-until: YYYY-MM-DD --> comment
# from the PR body, and removes the label when the date is reached. After
# label removal, creates a passing "Dependency Hold" check run on the PR's
# HEAD commit so the required status check is satisfied without relying on
# the unlabeled event (which GITHUB_TOKEN cannot trigger cross-workflow).
#
# Reaching the hold date is necessary but not sufficient. The point of aging a
# dependency PR is to give a compromise time to surface, so each expired PR has
# its pinned actions re-verified before the hold is released: upstream tags are
# re-resolved and the GitHub Advisory Database is queried. On a critical finding
# the label stays on, the check run fails, and the PR is left blocked for a
# human. Without this the hold is only a delay — nothing would notice a
# compromise disclosed on day three of a seven-day wait.
#
# Expired PRs are fanned out into a matrix so each one can be scanned at its own
# head SHA through the shared scan-pins action, without a checkout.
#
name: "Deps: Hold Expiry"

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      verify-pins:
        description: "Re-verify pinned actions before releasing a hold."
        required: false
        default: "true"
        type: string
      block-on-warning:
        description: "Also hold a PR when verification reports only warnings."
        required: false
        default: "false"
        type: string
    # No secrets required.

concurrency:
  group: deps-hold-expiry
  cancel-in-progress: true

jobs:
  find-expired:
    name: Find Expired Holds
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - name: Find PRs whose hold has expired
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Today: $TODAY"

          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --label on-hold --state open \
            --json number,body,headRefOid)

          EXPIRED="[]"
          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            NUMBER=$(echo "$PR" | jq -r '.number')
            BODY=$(echo "$PR" | jq -r '.body')
            HEAD_SHA=$(echo "$PR" | jq -r '.headRefOid')

            # Extract hold-until date from HTML comment (POSIX-compatible, no grep -P)
            HOLD_DATE=$(echo "$BODY" | sed -n 's/.*<!-- hold-until: \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\).*/\1/p' | head -n1)

            if [ -z "$HOLD_DATE" ]; then
              echo "PR #$NUMBER: No hold-until date found, skipping."
              continue
            fi

            if [[ "$TODAY" < "$HOLD_DATE" ]]; then
              echo "PR #$NUMBER: Still on hold until $HOLD_DATE."
              continue
            fi

            echo "PR #$NUMBER: Hold expired (was until $HOLD_DATE)."
            EXPIRED=$(echo "$EXPIRED" | jq -c \
              --argjson number "$NUMBER" \
              --arg head_sha "$HEAD_SHA" \
              --arg hold_date "$HOLD_DATE" \
              '. + [{number: $number, head_sha: $head_sha, hold_date: $hold_date}]')
          done < <(echo "$PRS" | jq -c '.[]')

          COUNT=$(echo "$EXPIRED" | jq 'length')
          echo "Expired holds: $COUNT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "matrix=${EXPIRED}" >> "$GITHUB_OUTPUT"

  release-hold:
    name: "Release Hold (PR #${{ matrix.pr.number }})"
    needs: find-expired
    if: github.repository_owner == 'arcuru' && needs.find-expired.outputs.count != '0'
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      # scan-pins reads the PR head through the contents/tree API. A job-level
      # block sets the complete permission set, so without this the scan finds
      # nothing on a private repository and the hold releases unverified.
      contents: read
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find-expired.outputs.matrix) }}
    steps:
      # Read the PR head through the API rather than checking it out, so the
      # verified content is exactly what the PR proposes to merge.
      - name: Scan pins at PR head
        id: scan
        if: inputs.verify-pins == 'true'
        uses: arcuru/actions/.github/actions/scan-pins@6568fce9d9e09782fcec9d9653411b35075c7902 # main
        with:
          repository: ${{ github.repository }}
          ref: ${{ matrix.pr.head_sha }}

      - name: Verify pins
        id: verify
        if: inputs.verify-pins == 'true'
        uses: arcuru/actions/.github/actions/verify-pins@fd93c1398401116e0b0a0b630ef6f002e2dad9ca # main
        with:
          pins: ${{ steps.scan.outputs.pins }}

      # Keep the hold on and block the PR. The pinned SHAs point at the original
      # commits, so the PR does not introduce the replacement — but the upstream
      # state differs from what the pin claims, which a human must explain.
      # A warning means something could not be checked, not that something is
      # wrong. Holding on warnings by default would deadlock any repository
      # carrying an uncommented pin, so that is opt-in — but a verification
      # that did not complete still blocks, since its silence proves nothing.
      - name: Block release on unresolved findings
        if: |
          !cancelled() && inputs.verify-pins == 'true' &&
          (steps.verify.conclusion != 'success' ||
           steps.verify.outputs.status == 'critical' ||
           (steps.verify.outputs.status == 'warning' && inputs.block-on-warning == 'true'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ matrix.pr.number }}
          HEAD_SHA: ${{ matrix.pr.head_sha }}
          HOLD_DATE: ${{ matrix.pr.hold_date }}
          REPORT: ${{ steps.verify.outputs.report }}
        run: |
          echo "::error::PR #${NUMBER}: pin verification failed, keeping hold."

          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST \
            -f name="Dependency Hold" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="failure" \
            -f "output[title]=Pin verification failed" \
            -f "output[summary]=$REPORT"

          COMMENT=$(printf '%s\n\n%s\n\n%s\n' \
            "Hold period expired (${HOLD_DATE}), but **pin verification failed** — keeping the \`on-hold\` label." \
            "$REPORT" \
            "A re-pointed immutable tag is the signature of a force-push supply-chain attack. The pinned SHAs in this PR refer to the original commits, so the PR does not introduce the replacement. Do not merge until the upstream change is explained.")
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT"

          exit 1

      # Release only on an affirmative pass. Anything else — a warning, or a
      # verification step that did not run at all — leaves the hold in place;
      # "not critical" would also be satisfied by a scan that never happened.
      - name: Release the hold
        if: |
          (inputs.verify-pins != 'true' && steps.scan.conclusion == 'skipped') ||
          (steps.verify.conclusion == 'success' &&
           (steps.verify.outputs.status == 'ok' ||
            (steps.verify.outputs.status == 'warning' && inputs.block-on-warning != 'true')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ matrix.pr.number }}
          HEAD_SHA: ${{ matrix.pr.head_sha }}
          HOLD_DATE: ${{ matrix.pr.hold_date }}
          REPORT: ${{ steps.verify.outputs.report }}
          VERIFY_PINS: ${{ inputs.verify-pins }}
        run: |
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label on-hold

          # Create a passing check run on the PR's HEAD commit so the
          # required "Dependency Hold" status check is satisfied. We
          # can't rely on the unlabeled event re-triggering the Hold
          # Gate workflow because GITHUB_TOKEN events don't trigger
          # other workflows (GitHub's anti-recursion policy).
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST \
            -f name="Dependency Hold" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="success" \
            -f "output[title]=Hold expired" \
            -f "output[summary]=Hold period expired (was until ${HOLD_DATE}). Dependency update may proceed."

          # Report what verification actually did, so a released hold reads as a
          # positive result rather than an absence of noise.
          if [ "$VERIFY_PINS" = "true" ]; then
            NOTE=$(printf '\n\n%s\n' "$REPORT")
          else
            NOTE=$'\n\nPin verification was disabled for this run.'
          fi
          COMMENT=$(printf '%s%s' \
            "Hold period expired (was until ${HOLD_DATE}). Removing \`on-hold\` label — this PR is eligible for merge." \
            "$NOTE")
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT"
