# Self-dogfood: keep this repo's own SHA pins fresh.
# Bumps actions/checkout, DeterminateSystems/*, etc. inside our own
# workflow files. This repo's references to its own actions use
# self-repository syntax (`uses: $/.github/actions/...`), which carries no
# ref and no version comment, so there is nothing here for the updater to
# bump and nothing that can drift out of step with the tree.
name: "Self: actions-update"

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  call:
    uses: ./.github/workflows/actions-update.yml
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
    secrets: inherit
