# Self-dogfood: keep this repo's own SHA pins fresh.
# Bumps actions/checkout, DeterminateSystems/*, etc. inside our own
# workflow files. Does NOT bump this repo's references to its own actions
# (arcuru/actions/.github/actions/...): they track this repo's main, which
# merging that PR advances, so every run would find drift it just created.
# Those are bumped by hand when the audit reports their content has drifted.
name: "Self: actions-update"

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  call:
    uses: ./.github/workflows/actions-update.yml
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
    secrets: inherit
