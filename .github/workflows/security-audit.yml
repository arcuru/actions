# Daily check of cargo dependencies against the RustSec Advisory Database.
# Creates/updates a GitHub issue with the "security" label on failure,
# and auto-closes it when all advisories are resolved. Caller repo must
# have `.config/deny.toml` and cargo-deny available in `nix develop`.
#
name: "Deps: Security Audit"

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys."
        required: false
        default: ""
        type: string
    # No secrets required — uses the workflow's built-in GITHUB_TOKEN.

concurrency:
  group: deps-security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Advisory Check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job: never leave the token in the checkout's git config.
          persist-credentials: false

      - name: Setup Nix
        uses: arcuru/actions/.github/actions/setup-nix@c8144123ad5a2c6316b7becab8233b68dfa637d9 # main
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      # Build the dev shell in its own step so that the Nix build log — hundreds
      # of kilobytes of downloads and `building ...` lines on a cold cache —
      # stays out of the report captured below.
      - name: Warm the dev shell
        run: nix develop --command true

      - name: Check advisories
        id: audit
        run: |
          set +e
          nix develop --command cargo deny check --config .config/deny.toml advisories \
            > "$REPORT" 2>&1
          EXIT_CODE=$?
          cat "$REPORT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          # The report goes to a file, not a step output: it is passed to the
          # reporting step below, where an inlined copy would land in the
          # environment block and fail the step with E2BIG once it exceeds the
          # 128 KiB per-string execve limit.
          REPORT: ${{ runner.temp }}/cargo-deny-advisories.txt

      - name: Find existing issue
        id: find_issue
        run: |
          ISSUE_NUMBER=$(gh issue list --label security --state open --search "Security Advisory Alert" --json number --jq '.[0].number // empty')
          echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue on failure
        if: steps.audit.outputs.exit_code != '0'
        run: |
          set -eo pipefail
          TITLE="Security Advisory Alert"
          BODY_FILE="${RUNNER_TEMP}/security-advisory-issue.md"

          # A GitHub issue body is capped at 65536 characters, so a very large
          # report cannot be posted whole. Keep the tail, which is where
          # cargo-deny prints the advisories and its verdict, and link the run
          # log for the rest. `tail -n +2` drops the partial first line left by
          # the byte-wise cut, which could otherwise split a UTF-8 sequence.
          MAX_REPORT_BYTES=50000
          TRUNCATED=""
          if [ "$(wc -c < "$REPORT")" -gt "$MAX_REPORT_BYTES" ]; then
            TRUNCATED=yes
            tail -c "$MAX_REPORT_BYTES" "$REPORT" | tail -n +2 > "${REPORT}.tail"
            mv "${REPORT}.tail" "$REPORT"
          fi

          {
            echo "## Security Advisory Found"
            echo
            echo "\`cargo deny check advisories\` found active advisories in dependencies."
            echo
            if [ -n "$TRUNCATED" ]; then
              echo "> Output truncated to the last ${MAX_REPORT_BYTES} bytes. The full report is in the [workflow run log](${RUN_URL})."
              echo
            fi
            echo "<details>"
            echo "<summary>Full output</summary>"
            echo
            echo '```'
            cat "$REPORT"
            echo
            echo '```'
            echo
            echo "</details>"
            echo
            echo "**Action required:** Review the advisories above and update affected dependencies or add ignore entries to \`.config/deny.toml\` if appropriate."
            echo
            echo "_Last checked: $(date -u +%Y-%m-%dT%H:%M:%SZ)_"
          } > "$BODY_FILE"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label security
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ runner.temp }}/cargo-deny-advisories.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}

      - name: Close issue on success
        if: steps.audit.outputs.exit_code == '0' && steps.find_issue.outputs.number != ''
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "All advisories resolved. Closing automatically."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}
