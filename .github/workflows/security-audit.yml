# Daily check of cargo dependencies against the RustSec Advisory Database.
# Creates/updates a GitHub issue with the "security" label on failure,
# and auto-closes it when all advisories are resolved. Caller repo must
# have `.config/deny.toml` and cargo-deny available in `nix develop`.
#
name: "Deps: Security Audit"

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys."
        required: false
        default: ""
        type: string
    # No secrets required — uses the workflow's built-in GITHUB_TOKEN.

concurrency:
  group: deps-security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Advisory Check
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: arcuru/actions/.github/actions/setup-nix@96f1d10b48db5907d8aa1fb517787b1d6e8ca4dd # v0.1.0
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      - name: Check advisories
        id: audit
        run: |
          set +e
          OUTPUT=$(nix develop --command cargo deny check --config .config/deny.toml advisories 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "output<<AUDIT_EOF"
            echo "$OUTPUT"
            echo "AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Find existing issue
        id: find_issue
        run: |
          ISSUE_NUMBER=$(gh issue list --label security --state open --search "Security Advisory Alert" --json number --jq '.[0].number // empty')
          echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue on failure
        if: steps.audit.outputs.exit_code != '0'
        run: |
          TITLE="Security Advisory Alert"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(cat <<'ISSUE_EOF'
          ## Security Advisory Found

          `cargo deny check advisories` found active advisories in dependencies.

          <details>
          <summary>Full output</summary>

          ```
          __AUDIT_OUTPUT__
          ```

          </details>

          **Action required:** Review the advisories above and update affected dependencies or add ignore entries to `.config/deny.toml` if appropriate.

          _Last checked: __TIMESTAMP___
          ISSUE_EOF
          )
          BODY="${BODY//__TIMESTAMP__/$TIMESTAMP}"
          BODY="${BODY//__AUDIT_OUTPUT__/$AUDIT_OUTPUT}"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label security
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_OUTPUT: ${{ steps.audit.outputs.output }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}

      - name: Close issue on success
        if: steps.audit.outputs.exit_code == '0' && steps.find_issue.outputs.number != ''
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "All advisories resolved. Closing automatically."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}
