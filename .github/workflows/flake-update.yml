# Monthly Nix flake input update. Runs `nix flake update` to bump flake.lock,
# generates a diff summary with GitHub compare links for each changed input,
# then creates a PR on the deps/flake-update branch with a configurable hold
# period before merge. CI handles verification via normal PR checks.
#
name: "Deps: Flake Update"

on:
  workflow_call:
    inputs:
      hold-days:
        description: "Days to hold before allowing merge."
        required: false
        default: "7"
        type: string
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      enable-magic-cache:
        description: "Enable DeterminateSystems Magic Nix Cache."
        required: false
        default: "true"
        type: string
      extra-substituters:
        description: "Newline-separated extra Nix substituter URLs."
        required: false
        default: ""
        type: string
      extra-trusted-public-keys:
        description: "Newline-separated trusted public keys."
        required: false
        default: ""
        type: string
    secrets:
      PAT_TOKEN:
        description: "Fine-grained PAT with contents:write + pull-requests:write on the calling repo."
        required: true

concurrency:
  group: deps-flake-update
  cancel-in-progress: true

jobs:
  flake-update:
    name: Flake Update
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          enable-magic-cache: ${{ inputs.enable-magic-cache }}
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}

      - name: Setup deps branch
        id: branch
        uses: $/.github/actions/setup-deps-branch
        with:
          prefix: deps/flake-update

      - name: Capture pre-update metadata
        id: before
        run: |
          METADATA=$(nix flake metadata --json)
          echo "$METADATA" > /tmp/flake-metadata-before.json

      - name: Run flake update
        id: update
        run: |
          set +e
          nix flake update 2>&1 | tee "$REPORT"
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          if (( PIPE_STATUSES[1] != 0 )); then
            exit "${PIPE_STATUSES[1]}"
          fi
          exit "${PIPE_STATUSES[0]}"
        env:
          REPORT: ${{ runner.temp }}/flake-update.txt

      - name: Generate input diff summary
        id: summary
        run: |
          BEFORE=/tmp/flake-metadata-before.json
          AFTER_JSON=$(nix flake metadata --json)

          SUMMARY=""

          for INPUT in $(echo "$AFTER_JSON" | jq -r '.locks.nodes.root.inputs | keys[]'); do
            NODE=$(echo "$AFTER_JSON" | jq -r ".locks.nodes.root.inputs[\"$INPUT\"]")
            if echo "$AFTER_JSON" | jq -e ".locks.nodes[\"$NODE\"].locked" > /dev/null 2>&1; then
              AFTER_REV=$(echo "$AFTER_JSON" | jq -r ".locks.nodes[\"$NODE\"].locked.rev // empty")
              AFTER_TYPE=$(echo "$AFTER_JSON" | jq -r ".locks.nodes[\"$NODE\"].locked.type // empty")
              AFTER_OWNER=$(echo "$AFTER_JSON" | jq -r ".locks.nodes[\"$NODE\"].locked.owner // empty")
              AFTER_REPO=$(echo "$AFTER_JSON" | jq -r ".locks.nodes[\"$NODE\"].locked.repo // empty")
            else
              continue
            fi

            BEFORE_REV=$(jq -r ".locks.nodes[\"$NODE\"].locked.rev // empty" "$BEFORE" 2>/dev/null)

            if [ -n "$BEFORE_REV" ] && [ -n "$AFTER_REV" ] && [ "$BEFORE_REV" != "$AFTER_REV" ]; then
              SHORT_BEFORE="${BEFORE_REV:0:7}"
              SHORT_AFTER="${AFTER_REV:0:7}"
              if [ "$AFTER_TYPE" = "github" ] && [ -n "$AFTER_OWNER" ] && [ -n "$AFTER_REPO" ]; then
                COMPARE_URL="https://github.com/$AFTER_OWNER/$AFTER_REPO/compare/${BEFORE_REV}...${AFTER_REV}"
                SUMMARY="${SUMMARY}- **${INPUT}**: [\`${SHORT_BEFORE}\` → \`${SHORT_AFTER}\`](${COMPARE_URL})\n"
              else
                SUMMARY="${SUMMARY}- **${INPUT}**: \`${SHORT_BEFORE}\` → \`${SHORT_AFTER}\`\n"
              fi
            fi
          done

          if [ -z "$SUMMARY" ]; then
            SUMMARY="No input revisions changed (lock file metadata update only)."
          fi

          printf '%b\n' "$SUMMARY" > "$SUMMARY_FILE"
        env:
          SUMMARY_FILE: ${{ runner.temp }}/flake-update-summary.txt

      - name: Generate PR body
        run: |
          # Keep the complete summary; truncate only its displayed copy. Dropping
          # the partial first line also avoids splitting a UTF-8 sequence.
          MAX_REPORT_BYTES=50000
          DISPLAY_FILE="$SUMMARY_FILE"
          if [ "$(wc -c < "$SUMMARY_FILE")" -gt "$MAX_REPORT_BYTES" ]; then
            DISPLAY_FILE="${SUMMARY_FILE}.tail"
            tail -c "$MAX_REPORT_BYTES" "$SUMMARY_FILE" | tail -n +2 > "$DISPLAY_FILE"
          fi

          {
            echo '## Flake Input Update'
            echo
            echo "Monthly \`nix flake update\` of Nix dependencies."
            echo
            echo '### Input Changes'
            echo
            cat "$DISPLAY_FILE"
            echo
            if [ "$DISPLAY_FILE" != "$SUMMARY_FILE" ]; then
              echo "> Summary truncated to the last ${MAX_REPORT_BYTES} bytes. See the lock file diff for all input changes."
              echo
            fi
            # The per-input summary already describes the update; raw Nix
            # download/build diagnostics belong in the run log, not the PR.
            echo "Full update diagnostics are in the [workflow run log](${RUN_URL})."
          } > "$BODY_FILE"
        env:
          SUMMARY_FILE: ${{ runner.temp }}/flake-update-summary.txt
          BODY_FILE: ${{ runner.temp }}/flake-update-pr.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit and create PR
        uses: $/.github/actions/commit-and-pr
        with:
          branch: ${{ steps.branch.outputs.branch }}
          files: flake.lock
          commit-message: "chore(deps): update flake inputs"
          pr-title: "chore(deps): update flake inputs"
          pr-body-file: ${{ runner.temp }}/flake-update-pr.md
          hold-days: ${{ inputs.hold-days }}
          update-comment: "Updated with latest `nix flake update` results."
          github-token: ${{ secrets.PAT_TOKEN }}
