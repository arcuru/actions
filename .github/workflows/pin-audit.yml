# Daily audit of SHA-pinned GitHub Actions against upstream tags and the
# GitHub Advisory Database. Creates/updates a GitHub issue with the "security"
# label on findings, and auto-closes it when they clear.
#
# This is the Actions-side counterpart to security-audit.yml, which covers
# Cargo dependencies via RustSec. Actions are the higher-risk surface, since
# they execute inside CI with whatever secrets the workflow exposes, and a
# compromise disclosed *after* a dependency PR merged is otherwise invisible.
#
# The important half is tag-integrity, not the advisory feed. Every recent
# Actions supply-chain attack (tj-actions, reviewdog, Trivy) worked by
# force-pushing existing release tags. Because callers pin by SHA, their pin
# keeps the good commit while the upstream tag starts serving a malicious one.
# Re-resolving each pinned immutable tag daily surfaces that divergence from
# public API data alone, days before an advisory is published.
#
name: "Deps: Pin Audit"

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
      environment:
        description: "GitHub Actions environment name for the job."
        required: false
        default: ""
        type: string
      fail-on-warning:
        description: "Treat unverifiable pins (no version comment) as a failure."
        required: false
        default: "false"
        type: string
    # No secrets required — uses the workflow's built-in GITHUB_TOKEN.

concurrency:
  group: deps-pin-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Pin Audit
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    if: github.repository_owner == 'arcuru'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read-only job: never leave the token in the checkout's git config.
          persist-credentials: false

      - name: Scan pins
        id: scan
        uses: arcuru/actions/.github/actions/scan-pins@6568fce9d9e09782fcec9d9653411b35075c7902 # main

      - name: Verify pins
        id: verify
        uses: arcuru/actions/.github/actions/verify-pins@6568fce9d9e09782fcec9d9653411b35075c7902 # main
        with:
          pins: ${{ steps.scan.outputs.pins }}

      - name: Find existing issue
        id: find_issue
        run: |
          ISSUE_NUMBER=$(gh issue list --label security --state open --search 'in:title "Action Pin Audit"' --json number --jq '.[0].number // empty')
          echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue on findings
        if: steps.verify.outputs.status != 'ok'
        run: |
          TITLE="Action Pin Audit"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(cat <<ISSUE_EOF
          ## Pinned Action Findings

          The daily pin audit found issues with this repository's SHA-pinned actions.

          ${REPORT}

          **A re-pointed immutable tag is the signature of a force-push supply-chain
          attack.** The pinned SHA refers to the original commit, so CI does not run
          the replacement — but do not bump these actions until the change is
          explained upstream.

          _Last checked: ${TIMESTAMP}_
          ISSUE_EOF
          )

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label security
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.verify.outputs.report }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}

      - name: Close issue when clear
        if: steps.verify.outputs.status == 'ok' && steps.find_issue.outputs.number != ''
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "All pin findings resolved. Closing automatically."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}

      - name: Fail the run on findings
        if: |
          steps.verify.outputs.status == 'critical' ||
          (steps.verify.outputs.status == 'warning' && inputs.fail-on-warning == 'true')
        env:
          CRITICAL: ${{ steps.verify.outputs.critical }}
          WARNING: ${{ steps.verify.outputs.warning }}
        run: |
          echo "::error::Pin audit found ${CRITICAL} critical and ${WARNING} warning finding(s). See the tracking issue."
          exit 1
