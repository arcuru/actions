# Required status check that blocks merging dependency update PRs during
# their hold period. Passes immediately for non-deps/ branches. For deps/
# branches, queries the GitHub API for current labels and fails if the PR
# has the "on-hold" label. Uses live label queries instead of event payload
# data so that manual re-runs always see the current label state.
#
# Safe to call from a merge_group trigger: a merge group has no head_ref, so
# the branch test below passes immediately. The hold gates entry into the
# queue, not the queue itself.
#
name: "Deps: Hold Gate"

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label or JSON list. Default: ubuntu-latest."
        required: false
        default: "ubuntu-latest"
        type: string
    # No secrets required.

permissions:
  contents: read
  pull-requests: read # required for `gh api .../pulls/N` label query below

# A merge group carries no pull request, so the number is empty for every one
# of them and they would all share a single group — with cancel-in-progress
# that means one batch cancels another, and a cancelled required check stalls
# the queue. github.ref is the unique per-batch queue branch there.
concurrency:
  group: deps-hold-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-hold:
    name: Dependency Hold
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Check hold status
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pass immediately for non-dependency branches
          if [[ ! "$HEAD_REF" =~ ^deps/ ]]; then
            echo "Not a dependency branch, skipping hold check."
            exit 0
          fi

          echo "Dependency branch detected: $HEAD_REF"

          # Query current labels from the API (not the event payload, which
          # is stale on manual re-runs)
          PR_LABELS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name]')
          echo "Current labels: $PR_LABELS"

          # Check for on-hold label
          if echo "$PR_LABELS" | jq -e 'index("on-hold")' > /dev/null 2>&1; then
            echo "::error::This dependency update is on hold. The on-hold label will be automatically removed after the hold period expires."
            exit 1
          fi

          echo "No hold in effect, dependency update may proceed."
